# Verification conditions (시험 조건) — 시험 전에 확정하는 값. 실측 결과가 아니다.
# 어떤 노드도 이 파일을 읽지 않는다. 노드 실행값은 ros2_ws/src/realsense_tracker/config/ 를 본다.
# 결과를 보고 조건을 바꾸지 않는다. 바꿨다면 변경 전·후와 이유를 report.md에 기록한다.
normal_tracking_sec: 30

occlusion:
  duration_sec: 2
  trials: 5
  recovery_success_sec: 3        # 재등장 후 3초 이내 TRACKING이면 성공 (판정 기준, 성능 합격선 아님)

target_timeout_sec: 0.5          # control.yaml target_timeout_sec와 같아야 함

recovery:
  valid_frames_required: 3       # control.yaml recovery_frames와 같아야 함

interrupt_test:
  target_topic_stop_trials: 1
  control_communication_stop_trials: 1

kp_compare:
  # 같은 대상·거리·해상도·이동 순서(왼쪽 3초 → 중앙 3초 → 오른쪽 3초 → 중앙 3초)로 각 3회
  settings:
    A:
      kp_pan: null  # TODO: 실기 방향 확인 후, 시험 전에 확정
      kp_tilt: null  # TODO
    B:
      kp_pan: null  # TODO
      kp_tilt: null  # TODO
  trials_per_setting: 3

manual_evaluation:
  visible_target_frames_min: 30
  no_target_frames_min: 10

# 유효 추적 비율 정의 (analyze_tracking.py와 동일):
#   분모 = 시험 구간의 /target 프레임 수, 분자 = detected(z>0) 이면서 state == TRACKING 인 프레임 수
# RMSE 포함 구간 = 위 분자와 같은 프레임 (제외 수를 함께 기록)
